[package]
name = "ainotepad"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ainotepad-core = { path = "../ainotepad-core" }
ainotepad-ai = { path = "../ainotepad-ai" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography"] }

[package.metadata.winres]
OriginalFilename = "ainotepad.exe"
FileDescription = "Ainotepad"
ProductName = "Ainotepad"

[build-dependencies]
embed-resource = "2"
