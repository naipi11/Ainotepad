[package]
name = "aitext"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aitext-core = { path = "../aitext-core" }
aitext-ai = { path = "../aitext-ai" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography"] }

[package.metadata.winres]
OriginalFilename = "aitext.exe"
FileDescription = "Aitext"
ProductName = "Aitext"

[build-dependencies]
embed-resource = "2"
